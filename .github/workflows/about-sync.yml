# src/data/about.ts is generated from README.md. If someone edits a README
# section the About panel draws from and forgets to regenerate, this fails.
name: About panel matches README

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/build-about.js
      - name: src/data/about.ts is up to date
        run: |
          if ! git diff --quiet -- src/data/about.ts; then
            echo "::error::src/data/about.ts is stale. Run: npm run about"
            git diff -- src/data/about.ts
            exit 1
          fi
