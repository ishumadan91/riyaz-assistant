# src/about.js is generated from README.md. If someone edits a README section
# the About panel draws from and forgets to regenerate, this fails loudly.
name: About panel matches README

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/build-about.js
      - name: src/about.js is up to date
        run: |
          if ! git diff --quiet -- src/about.js; then
            echo "::error::src/about.js is stale. Run: node scripts/build-about.js"
            git diff -- src/about.js
            exit 1
          fi
